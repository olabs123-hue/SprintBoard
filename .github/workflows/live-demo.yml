name: SprintBoard Live Demo Smoke
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  deployed-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/smoke_public_demo.py
